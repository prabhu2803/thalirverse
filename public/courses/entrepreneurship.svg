<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="ep-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3DE"/>
      <stop offset="100%" stop-color="#FFE1B3"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#ep-bg)"/>

  <!-- rocket, flying up -->
  <g transform="rotate(28 470 120)">
    <path d="M470 60 C486 78 486 118 470 140 C454 118 454 78 470 60 Z" fill="#F97316"/>
    <circle cx="470" cy="92" r="8" fill="#FFF3DE"/>
    <path d="M458 122 L446 142 L462 136 Z" fill="#E5484D"/>
    <path d="M482 122 L494 142 L478 136 Z" fill="#E5484D"/>
    <path d="M470 140 L462 158 L478 158 Z" fill="#FFC65C"/>
  </g>

  <!-- desk -->
  <rect x="60" y="300" width="480" height="26" rx="6" fill="#C98A4B"/>
  <rect x="80" y="326" width="16" height="46" fill="#A66C36"/>
  <rect x="484" y="326" width="16" height="46" fill="#A66C36"/>

  <!-- growth chart -->
  <g>
    <rect x="360" y="250" width="30" height="50" rx="4" fill="#FFC65C"/>
    <rect x="400" y="220" width="30" height="80" rx="4" fill="#FFA53C"/>
    <rect x="440" y="180" width="30" height="120" rx="4" fill="#F97316"/>
  </g>

  <!-- notebook -->
  <g>
    <rect x="120" y="240" width="150" height="60" rx="8" fill="#FFFFFF"/>
    <rect x="120" y="240" width="150" height="60" rx="8" fill="none" stroke="#E9C9A0" stroke-width="3"/>
    <line x1="140" y1="260" x2="250" y2="260" stroke="#E4B98A" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="274" x2="230" y2="274" stroke="#E4B98A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- lightbulb -->
  <g>
    <circle cx="220" cy="150" r="40" fill="#FFD166"/>
    <rect x="205" y="185" width="30" height="16" rx="4" fill="#8A8A94"/>
    <path d="M208 195 h24" stroke="#5B5B66" stroke-width="3"/>
    <g stroke="#FFA53C" stroke-width="5" stroke-linecap="round">
      <line x1="220" y1="88" x2="220" y2="72"/>
      <line x1="170" y1="112" x2="156" y2="100"/>
      <line x1="270" y1="112" x2="284" y2="100"/>
      <line x1="150" y1="150" x2="134" y2="150"/>
      <line x1="290" y1="150" x2="306" y2="150"/>
    </g>
  </g>
</svg>
